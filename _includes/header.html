<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="site-nav" aria-label="Main">
      {% for item in site.data.navigation %} {% assign is_current = false %} {% if page.url ==
      item.url %} {% assign is_current = true %} {% elsif item.match and page.url contains
      item.match %} {% assign is_current = true %} {% endif %}
      <a
        href="{{ item.url | relative_url }}"
        class="site-nav__link{% if is_current %} is-current{% endif %}"
        {%
        if
        is_current
        %}aria-current="page"
        {%
        endif
        %}
        >{{ item.title }}</a
      >
      {% endfor %}

      <button
        class="theme-toggle"
        type="button"
        aria-label="Toggle colour scheme"
        title="Toggle colour scheme"
      >
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.25"></circle>
          <path
            d="M12 1.75v2.5M12 19.75v2.5M1.75 12h2.5M19.75 12h2.5M4.75 4.75l1.8 1.8M17.45 17.45l1.8 1.8M19.25 4.75l-1.8 1.8M6.55 17.45l-1.8 1.8"
          ></path>
        </svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.75 6.75 0 0 0 11 11z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>
