<footer class="site-footer">
  <div class="site-footer__inner">
    <p>
      &copy; {{ site.time | date: '%Y' }} {{ site.author }} {% if site.email %}
      <span aria-hidden="true">·</span>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      {% endif %}
      <span aria-hidden="true">·</span>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/ben05allen" rel="me">GitHub</a>
    </p>
    <p class="site-footer__note">
      Built with <a href="https://jekyllrb.com">Jekyll</a>, hosted on GitHub Pages.
    </p>
  </div>
</footer>
