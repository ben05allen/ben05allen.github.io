---
layout: default
---
<article class="post">
  <header class="post__header">
    <h1 class="post__title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post__subtitle">{{ page.subtitle }}</p>{% endif %}
    {% include post-meta.html %}
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="post__footer">
    <nav class="post-nav" aria-label="Post navigation">
      {% if page.previous %}
        <a class="post-nav__prev" href="{{ page.previous.url | relative_url }}" rel="prev">
          <span class="post-nav__label">Previous</span>
          <span class="post-nav__title">{{ page.previous.title }}</span>
        </a>
      {% else %}<span></span>{% endif %}
      {% if page.next %}
        <a class="post-nav__next" href="{{ page.next.url | relative_url }}" rel="next">
          <span class="post-nav__label">Next</span>
          <span class="post-nav__title">{{ page.next.title }}</span>
        </a>
      {% endif %}
    </nav>

    <p class="post__back"><a href="{{ '/writing/' | relative_url }}">&larr; All posts</a></p>
  </footer>
</article>
