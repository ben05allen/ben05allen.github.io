---
layout: default
---

<article class="page">
  {% unless page.hide_title or page.title == nil %}
  <header class="page__header">
    <h1 class="page__title">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="page__subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>
  {% endunless %}

  <div class="prose">{{ content }}</div>
</article>
